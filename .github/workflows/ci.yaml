name: 🤖CI

on:
    pull_request:
    push:

    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    hardware:
        name: Hardware
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        steps:
            - uses: actions/checkout@v4
            - uses: prefix-dev/setup-pixi@v0.11.0
              with:
                  pixi-version: v0.82.0
                  environments: kortex
                  locked: true
                  cache: true
                  cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
            - name: Run the CI task
              run: pixi run -e kortex ci

    simulation:
        name: Simulation
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        steps:
            - uses: actions/checkout@v4
            - uses: prefix-dev/setup-pixi@v0.11.0
              with:
                  pixi-version: v0.82.0
                  environments: default
                  locked: true
                  cache: true
                  cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
            - name: Fetch pinned vendor sources
              run: pixi run west update
            - name: Apply recorded patches
              run: pixi run west pa
            - name: Build
              run: pixi run --locked build
